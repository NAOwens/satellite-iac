---
- name: Deploy Satellite Configuration from IaC
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    sat_host: "{{ survey_sat_host }}"
    sat_username: "{{ sat_admin_user }}"
    sat_token: "{{ sat_admin_pat }}"
    validate_certs_flag: false
    import_dir: "../iac-sat-exports"

  collections:
    - redhat.satellite

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - survey_sat_host is defined and survey_sat_host != ''
          - sat_username is defined and sat_username != ''
          - sat_token is defined and sat_token != ''
        fail_msg: "survey_sat_host, sat_admin_user, and sat_admin_pat must be provided"

  tasks:
    # ---------------------------------------------------------
    # 1. CORE ARCHITECTURE — Organizations and Locations
    # All other resources depend on these existing first.
    # ---------------------------------------------------------
    - name: Deploy Organizations
      redhat.satellite.organization:
        server_url: "{{ sat_host }}"
        username: "{{ sat_username }}"
        password: "{{ sat_token }}"
        validate_certs: "{{ validate_certs_flag }}"
        name: "{{ item.name }}"
        label: "{{ item.label }}"
        state: present
      loop: "{{ lookup('file', import_dir + '/organizations/organizations.yml') | from_yaml }}"

    - name: Deploy Locations
      redhat.satellite.location:
        server_url: "{{ sat_host }}"
        username: "{{ sat_username }}"
        password: "{{ sat_token }}"
        validate_certs: "{{ validate_certs_flag }}"
        name: "{{ item.name }}"
        state: present
      loop: "{{ lookup('file', import_dir + '/locations/locations.yml') | from_yaml }}"

    - name: Deploy Domains
      redhat.satellite.domain:
        server_url: "{{ sat_host }}"
        username: "{{ sat_username }}"
        password: "{{ sat_token }}"
        validate_certs: "{{ validate_certs_flag }}"
        name: "{{ item.name }}"
        state: present
      loop: "{{ lookup('file', import_dir + '/domains/domains.yml') | from_yaml }}"
      when: lookup('file', import_dir + '/domains/domains.yml') | from_yaml | length > 0

    # ---------------------------------------------------------
    # 2. IDENTITY & ACCESS — Auth Sources and Users
    # Auth sources must exist before users that reference them.
    # Bind passwords are not exported and must be set manually.
    # ---------------------------------------------------------
    - name: Deploy LDAP/AD Authentication Sources
      redhat.satellite.auth_source_ldap:
        server_url: "{{ sat_host }}"
        username: "{{ sat_username }}"
        password: "{{ sat_token }}"
        validate_certs: "{{ validate_certs_flag }}"
        name: "{{ item.name }}"
        host: "{{ item.host }}"
        port: "{{ item.port | default(389) }}"
        base_dn: "{{ item.base_dn }}"
        attr_login: "{{ item.attr_login }}"
        state: present
      loop: "{{ lookup('file', import_dir + '/auth_sources/auth_sources.yml') | from_yaml }}"
      when: lookup('file', import_dir + '/auth_sources/auth_sources.yml') | from_yaml | length > 0

    - name: Deploy Users
      redhat.satellite.user:
        server_url: "{{ sat_host }}"
        username: "{{ sat_username }}"
        password: "{{ sat_token }}"
        validate_certs: "{{ validate_certs_flag }}"
        login: "{{ item.login }}"
        firstname: "{{ item.firstname | default(omit) }}"
        lastname: "{{ item.lastname | default(omit) }}"
        mail: "{{ item.mail | default(omit) }}"
        auth_source: "{{ item.auth_source_name | default(omit) }}"
        state: present
      loop: "{{ lookup('file', import_dir + '/users/users.yml') | from_yaml }}"
      when: item.login != 'admin'

    # ---------------------------------------------------------
    # 3. CONTENT STRUCTURE — Products and Repositories
    # Custom products first, then Red Hat repositories.
    # Red Hat products are created automatically when repositories
    # are enabled from the manifest; only custom products need
    # explicit creation (identified by absence of cp_id).
    # ---------------------------------------------------------
    - name: Deploy Custom Products
      redhat.satellite.product:
        server_url: "{{ sat_host }}"
        username: "{{ sat_username }}"
        password: "{{ sat_token }}"
        validate_certs: "{{ validate_certs_flag }}"
        name: "{{ item.name }}"
        organization: "{{ item.organization.name }}"
        label: "{{ item.label | default(omit) }}"
        state: present
      loop: "{{ lookup('file', import_dir + '/products/products.yml') | from_yaml }}"
      when: item.cp_id is not defined

    - name: Enable Red Hat Repositories
      # Uses content_label (stable CDN identifier) to locate the correct
      # repository set — more reliable than product name or display name.
      redhat.satellite.repository_set:
        server_url: "{{ sat_host }}"
        username: "{{ sat_username }}"
        password: "{{ sat_token }}"
        validate_certs: "{{ validate_certs_flag }}"
        organization: "{{ item.organization.name }}"
        label: "{{ item.content_label }}"
        state: enabled
      loop: "{{ lookup('file', import_dir + '/redhat_repositories/redhat_repositories.yml') | from_yaml }}"
      when: item.content_label is defined

    # ---------------------------------------------------------
    # 4. CONTENT VIEWS AND COMPOSITE CONTENT VIEWS
    # Regular CVs must exist before CCVs that reference them
    # as components. Both must exist before Activation Keys
    # that reference a content_view by name.
    # Regular CVs are deployed first with their repository
    # assignments. CCVs are deployed after with latest=true
    # for all components (specific version pinning requires
    # a published version to exist, which needs a manual
    # publish step after repos sync).
    # Filters are exported to content_views/content_view_filters.yml
    # for reference but must be applied manually after deployment.
    # ---------------------------------------------------------
    - name: Load Content Views
      ansible.builtin.set_fact:
        all_cvs: "{{ lookup('file', import_dir + '/content_views/content_views.yml') | from_yaml }}"

    - name: Deploy regular Content Views
      redhat.satellite.content_view:
        server_url: "{{ sat_host }}"
        username: "{{ sat_username }}"
        password: "{{ sat_token }}"
        validate_certs: "{{ validate_certs_flag }}"
        name: "{{ item.name }}"
        organization: "{{ item.organization.name }}"
        repositories: >-
          {{
            item.repositories | default([])
            | json_query('[].{name: name, product: product.name}')
          }}
        state: present
      loop: "{{ all_cvs | rejectattr('composite', 'equalto', true) | list }}"
      when: all_cvs | length > 0

    - name: Deploy Composite Content Views
      redhat.satellite.content_view:
        server_url: "{{ sat_host }}"
        username: "{{ sat_username }}"
        password: "{{ sat_token }}"
        validate_certs: "{{ validate_certs_flag }}"
        name: "{{ item.name }}"
        organization: "{{ item.organization.name }}"
        composite: true
        auto_publish: "{{ item.auto_publish | default(false) }}"
        components: >-
          {{
            item.components | default([])
            | json_query('[].{content_view: content_view_version.content_view.name}')
            | map('combine', {'latest': true})
            | list
          }}
        state: present
      loop: "{{ all_cvs | selectattr('composite', 'equalto', true) | list }}"
      when: all_cvs | length > 0

    # ---------------------------------------------------------
    # 5. ENVIRONMENT & PROVISIONING — LCEs, Activation Keys,
    #    and Hostgroups
    # Lifecycle Environments must exist before Activation Keys
    # that reference them. Library is always present; skip it.
    # ---------------------------------------------------------
    - name: Deploy Lifecycle Environments
      redhat.satellite.lifecycle_environment:
        server_url: "{{ sat_host }}"
        username: "{{ sat_username }}"
        password: "{{ sat_token }}"
        validate_certs: "{{ validate_certs_flag }}"
        name: "{{ item.name }}"
        organization: "{{ item.organization.name }}"
        prior: "{{ item.prior_lifecycle_environment.name | default(omit) }}"
        state: present
      loop: "{{ lookup('file', import_dir + '/lifecycle_environments/lifecycle_environments.yml') | from_yaml }}"
      when: item.label != 'Library'

    - name: Deploy Activation Keys
      redhat.satellite.activation_key:
        server_url: "{{ sat_host }}"
        username: "{{ sat_username }}"
        password: "{{ sat_token }}"
        validate_certs: "{{ validate_certs_flag }}"
        name: "{{ item.name }}"
        organization: "{{ item.organization.name }}"
        lifecycle_environment: "{{ item.environment.name | default(omit) }}"
        content_view: "{{ item.content_view.name | default(omit) }}"
        state: present
      loop: "{{ lookup('file', import_dir + '/activation_keys/activation_keys.yml') | from_yaml }}"

    - name: Deploy Hostgroups
      redhat.satellite.hostgroup:
        server_url: "{{ sat_host }}"
        username: "{{ sat_username }}"
        password: "{{ sat_token }}"
        validate_certs: "{{ validate_certs_flag }}"
        name: "{{ item.name }}"
        organization: "{{ item.organizations[0].name | default(omit) }}"
        location: "{{ item.locations[0].name | default(omit) }}"
        state: present
      loop: "{{ lookup('file', import_dir + '/hostgroups/hostgroups.yml') | from_yaml }}"
      when: lookup('file', import_dir + '/hostgroups/hostgroups.yml') | from_yaml | length > 0

  post_tasks:
    - name: Display deployment summary
      ansible.builtin.debug:
        msg: |
          Satellite Configuration Deploy Complete
          Target: {{ sat_host }}
          Source: {{ import_dir }}

          Deployed in order:
            1. Organizations and Locations (core architecture)
            2. Domains
            3. LDAP/AD Authentication Sources
            4. Users (admin skipped — already exists)
            5. Custom Products
            6. Red Hat Repositories (enabled from manifest)
            7. Regular Content Views (repository assignments restored)
            8. Composite Content Views (components set to latest=true)
            9. Lifecycle Environments (Library skipped — always present)
            10. Activation Keys
            11. Hostgroups

          ACTION REQUIRED:
            - LDAP/AD bind passwords are not exported. Update auth source
              bind credentials manually after deployment.
            - Red Hat subscriptions require a valid manifest to be uploaded
              to the target Satellite before repositories can sync.
            - Content View filters are exported to
              content_views/content_view_filters.yml for reference but must
              be re-applied manually — see that file for filter definitions.
            - Publish and promote Content Views after repositories have synced.
              CCV components are set to latest=true; specific version pinning
              can be reconfigured after publishing.
            - Subscription attachments for Activation Keys are not restored —
              attach subscriptions manually if not using Simple Content Access.
