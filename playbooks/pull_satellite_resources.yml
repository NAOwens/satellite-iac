---
- name: Export Red Hat Satellite 6.18 Configuration to IaC
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    sat_host: "{{ survey_sat_host }}"
    sat_username: "{{ sat_admin_user }}"
    sat_token: "{{ sat_admin_pat }}"

    # Git / GitHub Configuration
    github_token_value: "{{ git_token_variable }}"
    git_repo_url: "https://NAOwens:{{ github_token_value }}@github.com/NAOwens/satellite-iac.git"
    git_clone_dest: "/tmp/satellite-iac"
    export_dir: "{{ git_clone_dest }}/iac-sat-exports"
    
    validate_certs_flag: false

  pre_tasks:
    - name: Validate required extra_vars
      ansible.builtin.assert:
        that:
          - survey_sat_host is defined and survey_sat_host != ''
          - sat_username is defined and sat_username != ''
          - sat_token is defined and sat_token != ''
          - github_token_value is defined and github_token_value != ''
        fail_msg: "survey_sat_host, sat_admin_user, sat_admin_pat, and git_token_variable must be provided"

    - name: Clone Satellite IaC repository from GitHub
      ansible.builtin.git:
        repo: "{{ git_repo_url }}"
        dest: "{{ git_clone_dest }}"
        version: "main"
        force: true
      no_log: true

    - name: Ensure export directories exist in the cloned repo
      ansible.builtin.file:
        path: "{{ export_dir }}/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - organizations
        - locations
        - domains
        - lifecycle_environments
        - hostgroups
        - activation_keys
        - subscriptions
        - redhat_repositories
        - products
        - content_views
        - sync_status
        - auth_sources
        - users

  tasks:
    # ---------------------------------------------------------
    # 1. ORGANIZATIONS
    # ---------------------------------------------------------
    - name: Fetch Organizations from Satellite
      ansible.builtin.uri:
        url: "{{ sat_host }}/api/v2/organizations?per_page=1000"
        method: GET
        url_username: "{{ sat_username }}"
        url_password: "{{ sat_token }}"
        force_basic_auth: true
        validate_certs: "{{ validate_certs_flag }}"
        return_content: true
      register: sat_orgs

    - name: Save Organizations to YAML
      ansible.builtin.copy:
        content: "{{ sat_orgs.json.results | to_nice_yaml(indent=2) }}"
        dest: "{{ export_dir }}/organizations/organizations.yml"

    # ---------------------------------------------------------
    # 2. LOCATIONS
    # ---------------------------------------------------------
    - name: Fetch Locations from Satellite
      ansible.builtin.uri:
        url: "{{ sat_host }}/api/v2/locations?per_page=1000"
        method: GET
        url_username: "{{ sat_username }}"
        url_password: "{{ sat_token }}"
        force_basic_auth: true
        validate_certs: "{{ validate_certs_flag }}"
        return_content: true
      register: sat_locs

    - name: Save Locations to YAML
      ansible.builtin.copy:
        content: "{{ sat_locs.json.results | to_nice_yaml(indent=2) }}"
        dest: "{{ export_dir }}/locations/locations.yml"

    # ---------------------------------------------------------
    # 3. DOMAINS
    # ---------------------------------------------------------
    - name: Fetch Domains from Satellite
      ansible.builtin.uri:
        url: "{{ sat_host }}/api/v2/domains?per_page=1000"
        method: GET
        url_username: "{{ sat_username }}"
        url_password: "{{ sat_token }}"
        force_basic_auth: true
        validate_certs: "{{ validate_certs_flag }}"
        return_content: true
      register: sat_domains

    - name: Save Domains to YAML
      ansible.builtin.copy:
        content: "{{ sat_domains.json.results | to_nice_yaml(indent=2) }}"
        dest: "{{ export_dir }}/domains/domains.yml"

    # ---------------------------------------------------------
    # 4. LIFECYCLE ENVIRONMENTS
    # ---------------------------------------------------------
    - name: Fetch Lifecycle Environments from Satellite
      ansible.builtin.uri:
        url: "{{ sat_host }}/katello/api/v2/environments?per_page=1000"
        method: GET
        url_username: "{{ sat_username }}"
        url_password: "{{ sat_token }}"
        force_basic_auth: true
        validate_certs: "{{ validate_certs_flag }}"
        return_content: true
      register: sat_lces

    - name: Save Lifecycle Environments to YAML
      ansible.builtin.copy:
        content: "{{ sat_lces.json.results | to_nice_yaml(indent=2) }}"
        dest: "{{ export_dir }}/lifecycle_environments/lifecycle_environments.yml"

    # ---------------------------------------------------------
    # 5. HOSTGROUPS
    # ---------------------------------------------------------
    - name: Fetch Hostgroups from Satellite
      ansible.builtin.uri:
        url: "{{ sat_host }}/api/v2/hostgroups?per_page=1000"
        method: GET
        url_username: "{{ sat_username }}"
        url_password: "{{ sat_token }}"
        force_basic_auth: true
        validate_certs: "{{ validate_certs_flag }}"
        return_content: true
      register: sat_hostgroups

    - name: Save Hostgroups to YAML
      ansible.builtin.copy:
        content: "{{ sat_hostgroups.json.results | to_nice_yaml(indent=2) }}"
        dest: "{{ export_dir }}/hostgroups/hostgroups.yml"

    # ---------------------------------------------------------
    # 6. ACTIVATION KEYS (looped by Organization)
    # ---------------------------------------------------------
    - name: Fetch Activation Keys from Satellite
      ansible.builtin.uri:
        # We append &organization_id={{ item.id }} to the URL
        url: "{{ sat_host }}/katello/api/v2/activation_keys?per_page=1000&organization_id={{ item.id }}"
        method: GET
        url_username: "{{ sat_username }}"
        url_password: "{{ sat_token }}"
        force_basic_auth: true
        validate_certs: "{{ validate_certs_flag }}"
        return_content: true
      register: sat_keys_results
      loop: "{{ sat_orgs.json.results }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Save Activation Keys to YAML
      ansible.builtin.copy:
        # We use map to extract only the results from the registered loop
        content: "{{ sat_keys_results.results | map(attribute='json.results') | flatten | to_nice_yaml(indent=2) }}"
        dest: "{{ export_dir }}/activation_keys/activation_keys.yml"

    # ---------------------------------------------------------
    # 7. SUBSCRIPTIONS (Pools)
    # ---------------------------------------------------------
    - name: Fetch Subscriptions from Satellite
      ansible.builtin.uri:
        url: "{{ sat_host }}/katello/api/v2/organizations/{{ item.id }}/subscriptions?per_page=1000"
        method: GET
        url_username: "{{ sat_username }}"
        url_password: "{{ sat_token }}"
        force_basic_auth: true
        validate_certs: "{{ validate_certs_flag }}"
        return_content: true
      register: sat_subs_results
      loop: "{{ sat_orgs.json.results }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Save Subscriptions to YAML
      ansible.builtin.copy:
        content: "{{ sat_subs_results.results | map(attribute='json.results') | flatten | to_nice_yaml(indent=2) }}"
        dest: "{{ export_dir }}/subscriptions/subscriptions.yml"

    # ---------------------------------------------------------
    # 8. ENABLED RED HAT REPOSITORIES (Katello API - Looped by Org)
    # ---------------------------------------------------------
    - name: Fetch Enabled Red Hat Repositories from Satellite
      ansible.builtin.uri:
        url: "{{ sat_host }}/katello/api/v2/repositories?per_page=1000&organization_id={{ item.id }}&enabled=true"
        method: GET
        url_username: "{{ sat_username }}"
        url_password: "{{ sat_token }}"
        force_basic_auth: true
        validate_certs: "{{ validate_certs_flag }}"
        return_content: true
      register: sat_repo_results
      loop: "{{ sat_orgs.json.results }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Save Red Hat Repositories to YAML
      ansible.builtin.copy:
        content: "{{ sat_repo_results.results | map(attribute='json.results') | flatten | to_nice_yaml(indent=2) }}"
        dest: "{{ export_dir }}/redhat_repositories/redhat_repositories.yml"

    # ---------------------------------------------------------
    # 9. PRODUCTS (Katello API - Looped by Org)
    # ---------------------------------------------------------
    - name: Fetch Products from Satellite
      ansible.builtin.uri:
        url: "{{ sat_host }}/katello/api/v2/products?per_page=1000&organization_id={{ item.id }}"
        method: GET
        url_username: "{{ sat_username }}"
        url_password: "{{ sat_token }}"
        force_basic_auth: true
        validate_certs: "{{ validate_certs_flag }}"
        return_content: true
      register: sat_product_results
      loop: "{{ sat_orgs.json.results }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Save Products to YAML
      ansible.builtin.copy:
        content: "{{ sat_product_results.results | map(attribute='json.results') | flatten | to_nice_yaml(indent=2) }}"
        dest: "{{ export_dir }}/products/products.yml"

    # ---------------------------------------------------------
    # 10. CONTENT VIEWS AND COMPOSITE CONTENT VIEWS
    # Fetched per organization. The default organization view
    # (default: true) is excluded — it cannot be managed and
    # is always present on every Satellite.
    # Filters are fetched per CV via a separate API call.
    # ---------------------------------------------------------
    - name: Fetch Content Views from Satellite
      ansible.builtin.uri:
        url: "{{ sat_host }}/katello/api/v2/content_views?per_page=1000&organization_id={{ item.id }}&nondefault=true"
        method: GET
        url_username: "{{ sat_username }}"
        url_password: "{{ sat_token }}"
        force_basic_auth: true
        validate_certs: "{{ validate_certs_flag }}"
        return_content: true
      register: sat_cv_results
      loop: "{{ sat_orgs.json.results }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Build combined Content View list
      ansible.builtin.set_fact:
        all_content_views: >-
          {{
            sat_cv_results.results
            | map(attribute='json.results')
            | flatten
            | rejectattr('default', 'equalto', true)
            | list
          }}

    - name: Save Content Views to YAML
      ansible.builtin.copy:
        content: "{{ all_content_views | to_nice_yaml(indent=2) }}"
        dest: "{{ export_dir }}/content_views/content_views.yml"

    - name: Fetch Content View Filters
      ansible.builtin.uri:
        url: "{{ sat_host }}/katello/api/v2/content_views/{{ item.id }}/filters?per_page=1000"
        method: GET
        url_username: "{{ sat_username }}"
        url_password: "{{ sat_token }}"
        force_basic_auth: true
        validate_certs: "{{ validate_certs_flag }}"
        return_content: true
      register: sat_cv_filter_results
      loop: "{{ all_content_views }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Save Content View Filters to YAML
      ansible.builtin.copy:
        content: "{{ sat_cv_filter_results.results | map(attribute='json.results') | flatten | to_nice_yaml(indent=2) }}"
        dest: "{{ export_dir }}/content_views/content_view_filters.yml"

    # ---------------------------------------------------------
    # 11. REPOSITORY SYNC STATUS (derived from repository data already fetched)
    # ---------------------------------------------------------
    - name: Save Sync Status to YAML
      ansible.builtin.copy:
        content: |
          {% set sync_summary = [] %}
          {% for org_result in sat_repo_results.results %}
            {% for repo in org_result.json.results %}
              {% set _ = sync_summary.append({
                'repository_name': repo.name | default('Unknown'),
                'product_name': repo.product.name | default('Unknown'),
                'last_sync_status': repo.last_sync_status | default('Not Synced'),
                'last_sync_at': repo.updated_at | default('Never')
              }) %}
            {% endfor %}
          {% endfor %}
          {{ sync_summary | to_nice_yaml(indent=2) }}
        dest: "{{ export_dir }}/sync_status/sync_status.yml"

    # ---------------------------------------------------------
    # 12. AUTHENTICATION SOURCES (LDAP/AD)
    # ---------------------------------------------------------
    - name: Fetch Authentication Sources from Satellite
      ansible.builtin.uri:
        url: "{{ sat_host }}/api/v2/auth_source_ldaps?per_page=1000"
        method: GET
        url_username: "{{ sat_username }}"
        url_password: "{{ sat_token }}"
        force_basic_auth: true
        validate_certs: "{{ validate_certs_flag }}"
        return_content: true
      register: sat_auth_sources

    - name: Save Authentication Sources to YAML
      ansible.builtin.copy:
        content: "{{ sat_auth_sources.json.results | to_nice_yaml(indent=2) }}"
        dest: "{{ export_dir }}/auth_sources/auth_sources.yml"
    
    # ---------------------------------------------------------
    # 13. USERS (Foreman API)
    # ---------------------------------------------------------
    - name: Fetch Users from Satellite
      ansible.builtin.uri:
        url: "{{ sat_host }}/api/v2/users?per_page=1000"
        method: GET
        url_username: "{{ sat_username }}"
        url_password: "{{ sat_token }}"
        force_basic_auth: true
        validate_certs: "{{ validate_certs_flag }}"
        return_content: true
      register: sat_users

    - name: Save Users to YAML
      ansible.builtin.copy:
        content: "{{ sat_users.json.results | to_nice_yaml(indent=2) }}"
        dest: "{{ export_dir }}/users/users.yml"

  post_tasks:
    # ---------------------------------------------------------
    # GIT COMMIT AND PUSH
    # ---------------------------------------------------------
    - name: Check for changed files
      ansible.builtin.command: git status --porcelain
      args:
        chdir: "{{ git_clone_dest }}"
      register: git_status
      changed_when: false

    - name: Configure Git Identity
      ansible.builtin.command: "{{ item }}"
      args:
        chdir: "{{ git_clone_dest }}"
      loop:
        - git config user.email "owensna7@gmail.com"
        - git config user.name "NAOwens"
      when: git_status.stdout | length > 0

    - name: Add changes to Git
      ansible.builtin.command: git add .
      args:
        chdir: "{{ git_clone_dest }}"
      when: git_status.stdout | length > 0

    - name: Commit changes to Git
      ansible.builtin.command: git commit -m "Automated export of Satellite 6.18 configuration"
      args:
        chdir: "{{ git_clone_dest }}"
      when: git_status.stdout | length > 0

    - name: Push changes to GitHub
      ansible.builtin.command: git push origin main
      args:
        chdir: "{{ git_clone_dest }}"
      when: git_status.stdout | length > 0
      changed_when: true
      no_log: true

    - name: Display export summary
      ansible.builtin.debug:
        msg: |
          Satellite Export Complete!
          Data saved and pushed to: https://github.com/NAOwens/satellite-iac
          - Organizations: {{ sat_orgs.json.results | length }}
          - Locations: {{ sat_locs.json.results | length }}
          - Domains: {{ sat_domains.json.results | length }}
          - Lifecycle Environments: {{ sat_lces.json.results | length }}
          - Hostgroups: {{ sat_hostgroups.json.results | length }}
          - Activation Keys: {{ sat_keys_results.results | map(attribute='json.results') | flatten | length }}
          - Subscriptions: {{ sat_subs_results.results | map(attribute='json.results') | flatten | length }}
          - Enabled Red Hat Repositories: {{ sat_repo_results.results | map(attribute='json.results') | flatten | length }}
          - Products: {{ sat_product_results.results | map(attribute='json.results') | flatten | length }}
          - Content Views: {{ all_content_views | rejectattr('composite', 'equalto', true) | list | length }}
          - Composite Content Views: {{ all_content_views | selectattr('composite', 'equalto', true) | list | length }}
          - Content View Filters: {{ sat_cv_filter_results.results | map(attribute='json.results') | flatten | length }}
          - Sync Status Records: {{ sat_repo_results.results | map(attribute='json.results') | flatten | length }}
          - Authentication Sources: {{ sat_auth_sources.json.results | length }}
          - Users: {{ sat_users.json.results | length }}
          - Git Push Status: {{ 'Changes pushed to GitHub' if git_status.stdout | length > 0 else 'No changes detected, nothing to push' }}